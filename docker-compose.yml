services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: porchfest-db
    environment:
      POSTGRES_USER: porchfest
      POSTGRES_PASSWORD: porchfest_dev
      POSTGRES_DB: porchfest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: