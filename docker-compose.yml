services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: porchfest-db
    environment:
      POSTGRES_USER: porchfest
      POSTGRES_PASSWORD: porchfest_dev
      POSTGRES_DB: porchfest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porchfest -d porchfest"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://porchfest:porchfest_dev@db:5432/porchfest
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=dev-secret-change-in-production
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (for production builds)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: porchfest-network
