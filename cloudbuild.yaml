# Google Cloud Build configuration for deploying to Cloud Run
# Trigger this build from your CI/CD pipeline

steps:
  # Build the backend container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/porchfest-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/porchfest-api:latest'
      - './backend'
    id: 'build-backend'

  # Push backend to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/porchfest-api:$COMMIT_SHA'
    id: 'push-backend'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/porchfest-api:latest'
    waitFor: ['build-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'porchfest-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/porchfest-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},FRONTEND_URL=${_FRONTEND_URL}'
      - '--set-secrets'
      - 'SUPABASE_SERVICE_KEY=supabase-service-key:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-backend'
    waitFor: ['push-backend']

substitutions:
  _REGION: us-central1
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _FRONTEND_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/porchfest-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/porchfest-api:latest'

