name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/porchfest-api:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/porchfest-api:${{ github.sha }}

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          docker build \
            --build-arg VITE_API_URL="" \
            -t ${{ steps.ecr.outputs.registry }}/porchfest-frontend:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/porchfest-frontend:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy porchfest ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters '{"commands":["/opt/porchfest/deploy.sh ${{ steps.ecr.outputs.registry }} ${{ github.sha }}"]}' \
            --output text --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for completion
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "InProgress")

            case $STATUS in
              Success)
                echo "Deployment successful"
                break
                ;;
              Failed|TimedOut|Cancelled)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
              *)
                echo "Status: $STATUS, waiting..."
                sleep 5
                ;;
            esac
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
