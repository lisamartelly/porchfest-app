<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#cb6f42"/>
  <!-- Standup bass silhouette -->
  <g fill="#fff" stroke="none">
    <!-- Neck -->
    <rect x="47" y="12" width="6" height="35" rx="2"/>
    <!-- Scroll -->
    <circle cx="50" cy="12" r="5"/>
    <circle cx="50" cy="12" r="2.5" fill="#cb6f42"/>
    <!-- Tuning pegs -->
    <rect x="43" y="15" width="4" height="2" rx="1"/>
    <rect x="53" y="15" width="4" height="2" rx="1"/>
    <rect x="43" y="20" width="4" height="2" rx="1"/>
    <rect x="53" y="20" width="4" height="2" rx="1"/>
    <!-- Body upper bout -->
    <ellipse cx="50" cy="52" rx="14" ry="10"/>
    <!-- Body lower bout -->
    <ellipse cx="50" cy="72" rx="18" ry="14"/>
    <!-- Waist (cut-ins) - using body color to create waist -->
    <ellipse cx="34" cy="62" rx="4" ry="7" fill="#cb6f42"/>
    <ellipse cx="66" cy="62" rx="4" ry="7" fill="#cb6f42"/>
    <!-- F-holes -->
    <ellipse cx="43" cy="65" rx="2" ry="6" fill="#cb6f42"/>
    <ellipse cx="57" cy="65" rx="2" ry="6" fill="#cb6f42"/>
    <!-- Bridge -->
    <rect x="44" y="69" width="12" height="2" rx="1" fill="#cb6f42"/>
    <!-- Tailpiece -->
    <path d="M47 75 L50 85 L53 75 Z" fill="#cb6f42"/>
    <!-- Endpin -->
    <rect x="49" y="85" width="2" height="6" rx="1"/>
    <!-- Strings -->
    <line x1="48" y1="25" x2="48" y2="75" stroke="#cb6f42" stroke-width="0.7"/>
    <line x1="50" y1="25" x2="50" y2="75" stroke="#cb6f42" stroke-width="0.7"/>
    <line x1="52" y1="25" x2="52" y2="75" stroke="#cb6f42" stroke-width="0.7"/>
  </g>
</svg>
